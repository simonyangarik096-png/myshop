<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Մուտք — MyShop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="logo">🛍️ MyShop</a>
      <nav class="nav-links">
        <a href="/" data-i18n="nav.home">Գլխավոր</a>
        <a href="/shop.html" data-i18n="nav.shop">Խանութ</a>
        <a href="/cart.html" data-i18n="nav.cart">Զամբյուղ</a>
      </nav>
      <div class="nav-right">
        <select id="langSelect" class="lang-select">
          <option value="hy">🇦🇲 Հայ</option>
          <option value="ru">🇷🇺 Рус</option>
          <option value="en">🇬🇧 Eng</option>
        </select>
        <a href="/register.html" class="btn btn-outline" data-i18n="nav.register">Գրանցում</a>
      </div>
    </div>
  </header>

  <main class="container">
    <form class="form-card" id="loginForm">
      <h2 data-i18n="auth.loginTitle">Մուտք</h2>

      <div class="form-group">
        <label data-i18n="auth.email">Էլ. փոստ</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label data-i18n="auth.password">Գաղտնաբառ</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.loginBtn">Մուտք</button>

      <p id="msg" class="form-error"></p>

      <p style="margin-top:16px;text-align:center;font-size:14px">
        <span data-i18n="auth.noAccount">Հաշիվ չունե՞ս</span>?
        <a href="/register.html" data-i18n="auth.registerBtn">Գրանցվել</a>
      </p>
    </form>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
