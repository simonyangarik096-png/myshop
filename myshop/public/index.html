<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyShop — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="logo">🛍️ MyShop</a>

      <nav class="nav-links">
        <a href="/" data-i18n="nav.home">Գլխավոր</a>
        <a href="/shop.html" data-i18n="nav.shop">Խանութ</a>
        <a href="/cart.html" data-i18n="nav.cart">Զամբյուղ</a>
        <a href="/dashboard.html" data-i18n="nav.dashboard" id="navDashboard" style="display:none">Վահանակ</a>
        <a href="/admin.html" data-i18n="nav.admin" id="navAdmin" style="display:none">Admin</a>
      </nav>

      <div class="nav-right">
        <select id="langSelect" class="lang-select">
          <option value="hy">🇦🇲 Հայ</option>
          <option value="ru">🇷🇺 Рус</option>
          <option value="en">🇬🇧 Eng</option>
        </select>
        <a href="/login.html" class="btn btn-outline" id="btnLogin" data-i18n="nav.login">Մուտք</a>
        <button class="btn btn-outline" id="btnLogout" style="display:none" data-i18n="nav.logout">Ելք</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1 data-i18n="home.title">Գտիր ձեռագործ և եզակի ապրանքներ</h1>
      <p data-i18n="home.subtitle">Արտադրողներ և վերավաճառողներ մեկ հարթակում</p>

      <div class="hero-filters">
        <button class="chip active" data-type="" data-i18n="filter.all">Բոլորը</button>
        <button class="chip" data-type="maker" data-i18n="filter.makers">Արտադրողներ</button>
        <button class="chip" data-type="reseller" data-i18n="filter.resellers">Վերավաճառողներ</button>
      </div>

      <div class="hero-search">
        <input type="text" id="searchInput" placeholder="Փնտրել ապրանք..." data-i18n-placeholder="home.search" />
        <button class="btn btn-primary" id="btnSearch" data-i18n="home.searchBtn">Փնտրել</button>
      </div>
    </div>
  </section>

  <!-- Category filter -->
  <section class="container category-bar">
    <span data-i18n="home.category">Կատեգորիա:</span>
    <select id="categorySelect">
      <option value="" data-i18n="filter.allCategories">Բոլորը</option>
      <option value="clothes">Հագուստ</option>
      <option value="food">Սնունդ</option>
      <option value="handmade">Ձեռագործ</option>
      <option value="electronics">Էլեկտրոնիկա</option>
    </select>
  </section>

  <!-- Products grid -->
  <main class="container">
    <div id="productsGrid" class="products-grid">
      <div class="loading" data-i18n="common.loading">Բեռնվում է...</div>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 MyShop. <span data-i18n="footer.rights">Բոլոր իրավունքները պաշտպանված են</span>.</p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
