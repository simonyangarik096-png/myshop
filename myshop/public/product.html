<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ապրանք — MyShop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="logo">🛍️ MyShop</a>
      <nav class="nav-links">
        <a href="/" data-i18n="nav.home">Գլխավոր</a>
        <a href="/shop.html" data-i18n="nav.shop">Խանութ</a>
        <a href="/cart.html" data-i18n="nav.cart">Զամբյուղ</a>
        <a href="/dashboard.html" data-i18n="nav.dashboard" id="navDashboard" style="display:none">Վահանակ</a>
        <a href="/admin.html" data-i18n="nav.admin" id="navAdmin" style="display:none">Admin</a>
      </nav>
      <div class="nav-right">
        <select id="langSelect" class="lang-select">
          <option value="hy">🇦🇲 Հայ</option>
          <option value="ru">🇷🇺 Рус</option>
          <option value="en">🇬🇧 Eng</option>
        </select>
        <a href="/login.html" class="btn btn-outline" id="btnLogin" data-i18n="nav.login">Մուտք</a>
        <button class="btn btn-outline" id="btnLogout" style="display:none" data-i18n="nav.logout">Ելք</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="productWrap" style="padding:30px 0">
      <div class="loading" data-i18n="common.loading">Բեռնվում է...</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 MyShop. <span data-i18n="footer.rights">Բոլոր իրավունքները պաշտպանված են</span>.</p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
